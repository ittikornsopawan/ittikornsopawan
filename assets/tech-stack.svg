<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title description">
  <title id="title">Tech Stack</title>
  <desc id="description">Uppercase technology names grouped in pastel gradient pills by category.</desc>
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff3cf"/>
      <stop offset="1" stop-color="#ffe4ae"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#c7d2fe"/>
